# Быстрый старт team-docs одним контейнером + Postgres.
#   docker compose up -d --build
# UI и API: http://localhost:8080 (миграции применяются при старте).
# Тестовая инфраструктура для go test — в docker-compose.test.yml.

name: team-docs

services:
  app:
    build: .
    ports:
      - "${TEAMDOCS_PORT:-8080}:8080"
    environment:
      TEAMDOCS_HTTP__HOST: 0.0.0.0
      TEAMDOCS_HTTP__PORT: "8080"
      TEAMDOCS_DB__DSN: postgres://teamdocs:${TEAMDOCS_DB_PASSWORD:-teamdocs}@postgres:5432/teamdocs?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamdocs
      POSTGRES_PASSWORD: ${TEAMDOCS_DB_PASSWORD:-teamdocs}
      POSTGRES_DB: teamdocs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamdocs -d teamdocs"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:

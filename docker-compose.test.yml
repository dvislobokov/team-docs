# Тестовая инфраструктура team-docs.
#
# Ядро (postgres) поднимается всегда, остальное — по profiles:
#   docker compose -f docker-compose.test.yml up -d --wait            # только postgres
#   docker compose -f docker-compose.test.yml --profile cache up -d   # + redis standalone
#   Профили: mail | cache | cache-sentinel | cache-cluster | s3
#   docker compose -f docker-compose.test.yml down -v                 # остановить и почистить
#
# Порты переопределяются через переменные окружения (см. ${VAR:-default}),
# чтобы не конфликтовать с dev-инстансами.
#
# ВАЖНО: sentinel и cluster анонсируют клиентам внутренние адреса docker-сети,
# поэтому тесты этих режимов запускаются в контейнере в этой же сети (или в CI);
# с хоста доступен standalone-redis и postgres. TLS-варианты redis появятся
# вместе с тестовыми сертификатами (deploy/test-certs, задача раздела 12).

name: team-docs-test

services:
  # --- ядро: единственная зависимость текущих интеграционных тестов ---
  postgres:
    image: postgres:16-alpine
    ports:
      - "${PG_TEST_PORT:-54329}:5432"
    environment:
      POSTGRES_USER: teamdocs
      POSTGRES_PASSWORD: teamdocs
      POSTGRES_DB: teamdocs_test
    # Персистентность тестам не нужна — tmpfs заметно ускоряет прогоны.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamdocs -d teamdocs_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  # --- LDAP (интеграционные тесты авторизации, §8) ---
  # Структуру тесты сидируют сами через admin-bind (cn=admin,dc=corp,dc=local).
  ldap:
    profiles: [ldap]
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "Team Docs"
      LDAP_DOMAIN: "corp.local"
      LDAP_ADMIN_PASSWORD: "adminpass"
    ports:
      - "${LDAP_TEST_PORT:-38900}:389"

  # --- почта (уведомления/дайджесты, этап 4) ---
  mailpit:
    profiles: [mail]
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025"   # web UI

  # --- кэш: standalone (раздел 12) ---
  redis:
    profiles: [cache]
    image: redis:7-alpine
    ports:
      - "${REDIS_TEST_PORT:-63790}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  # --- кэш: sentinel (master + replica + 1 sentinel, кворум 1) ---
  redis-master:
    profiles: [cache-sentinel]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis-replica:
    profiles: [cache-sentinel]
    image: redis:7-alpine
    command: redis-server --replicaof redis-master 6379
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel:
    profiles: [cache-sentinel]
    image: redis:7-alpine
    # Официальный образ не умеет sentinel-конфиг из env — генерируем на лету.
    command:
      - sh
      - -c
      - |
        printf '%s\n' \
          'port 26379' \
          'sentinel monitor teamdocs redis-master 6379 1' \
          'sentinel down-after-milliseconds teamdocs 1000' \
          'sentinel failover-timeout teamdocs 5000' \
          'sentinel resolve-hostnames yes' \
          'sentinel announce-hostnames yes' \
          > /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf
    ports:
      - "${REDIS_SENTINEL_PORT:-26379}:26379"
    depends_on:
      redis-master:
        condition: service_healthy

  # --- кэш: cluster (3 мастера без реплик — минимум для тестов) ---
  redis-cluster-1:
    profiles: [cache-cluster]
    image: redis:7-alpine
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly no
  redis-cluster-2:
    profiles: [cache-cluster]
    image: redis:7-alpine
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly no
  redis-cluster-3:
    profiles: [cache-cluster]
    image: redis:7-alpine
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly no

  redis-cluster-init:
    profiles: [cache-cluster]
    image: redis:7-alpine
    command: >
      sh -c "sleep 2 && redis-cli --cluster create
      redis-cluster-1:6379 redis-cluster-2:6379 redis-cluster-3:6379
      --cluster-replicas 0 --cluster-yes"
    depends_on:
      - redis-cluster-1
      - redis-cluster-2
      - redis-cluster-3

  # --- внешнее хранилище файлов (раздел 4, если дойдём) ---
  minio:
    profiles: [s3]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: teamdocs
      MINIO_ROOT_PASSWORD: teamdocs-test
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

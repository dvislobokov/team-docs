name: Docker

# Публикация dev-образа в GitHub Container Registry: push в main → тег edge.
# Версионные образы (2026.07.21, latest) публикует release.yml — релиз
# запускается вручную. Авторизация — встроенный GITHUB_TOKEN.
on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Образ в ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги и метки образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main

      - name: Сборка и пуш (Dockerfile в корне)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

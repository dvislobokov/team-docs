name: Release

# Релиз по кнопке (Actions → Release → Run workflow), версия календарная,
# как у JetBrains: 2026.07.21; повторная сборка в тот же день — 2026.07.21.2.
# От сообщений коммитов ничего не зависит. Workflow сам ставит git-тег,
# собирает бинари, публикует GitHub Release и докер-образ.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Версия по дате и git-тег
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужны существующие теги для проверки повторной сборки за день

      - name: Вычислить версию и запушить тег
        id: tag
        run: |
          base="$(date -u +%Y.%m.%d)"
          version="$base"
          n=1
          while git rev-parse -q --verify "refs/tags/$version" >/dev/null; do
            n=$((n+1)); version="$base.$n"
          done
          echo "-> $version"
          git tag "$version"
          git push origin "refs/tags/$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Бинари (все платформы)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Без package-lock (решение: разные мажоры npm генерируют несовместимые
      # lock-файлы) — ставим по диапазонам из package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Сборка фронта
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Кросс-сборка бинарей (тег prod, фронт встроен)
        run: |
          mkdir -p dist
          version="${{ needs.version.outputs.version }}"
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            out="dist/team-docs-${version}-${os}-${arch}${ext}"
            echo "-> $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -tags prod -trimpath \
                -ldflags "-s -w -X main.version=${version}" \
                -o "$out" ./cmd/server
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true

  docker:
    name: Версионный образ в ghcr.io
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги и метки образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest

      - name: Сборка и пуш (Dockerfile в корне)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

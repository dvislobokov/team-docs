name: Release

# Релиз на тег v*: кросс-платформенные бинари с встроенным фронтом
# + прикрепление к GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Бинари (все платформы)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Сборка фронта
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Кросс-сборка бинарей (тег prod, фронт встроен)
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            out="dist/team-docs-${version}-${os}-${arch}${ext}"
            echo "-> $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -tags prod -trimpath -ldflags "-s -w" -o "$out" ./cmd/server
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
